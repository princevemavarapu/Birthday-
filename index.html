<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>To My Love, Selfie</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(to top right, #ff9a9e, #fad0c4);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      text-align: center;
    }
    .container {
      padding: 60px 20px;
    }
    h1 {
      font-size: 3em;
      margin-bottom: 20px;
    }
    p {
      font-size: 1.5em;
      max-width: 600px;
      margin: 0 auto;
    }
    .heart {
      font-size: 4em;
      margin: 20px 0;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>To My Love, Selfie</h1>
    <div class="heart">❤️</div>
    <p>
      You light up my world like no one else. Every moment with you is magic.  
      Here's to many more beautiful memories, laughter, and love.  
      I’m so lucky to have you.
    </p>
  </div>
</body>
</html>
